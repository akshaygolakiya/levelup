name: LevelUp
options:
  bundleIdPrefix: com.akshay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LevelUp:
    type: application
    platform: iOS
    sources:
      - LevelUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshay.levelup
        PRODUCT_NAME: LevelUp
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LevelUp
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "LevelUp records your voice during speaking practice. Recordings stay on this device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "LevelUp transcribes your speaking practice to count words, pace and filler words. Transcription runs on-device when supported."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  LevelUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LevelUpTests
    dependencies:
      - target: LevelUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshay.levelup.tests
        GENERATE_INFOPLIST_FILE: YES
  LevelUpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LevelUpUITests
    dependencies:
      - target: LevelUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshay.levelup.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LevelUp:
    build:
      targets:
        LevelUp: all
    test:
      targets:
        - LevelUpTests
        - LevelUpUITests
